<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TenderBase</title>
<style>
  :root{--navy:#0F2A43;--ink:#1F2933;--ink2:#5B6B7C;--line:#E3E8EE;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
       background:#F7F9FB;color:var(--ink);
       font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:24px;text-align:center}
  .w{max-width:320px}
  .logo{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--navy);margin:0 0 8px}
  .dot{color:#3E7CB1}
  h1{font-size:17px;font-weight:600;margin:24px 0 8px}
  p{font-size:14px;line-height:1.5;color:var(--ink2);margin:0 0 20px}
  button{width:100%;padding:14px;border:0;border-radius:14px;background:var(--navy);
         color:#fff;font-size:15px;font-weight:600;font-family:inherit}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 22px}
</style>
</head>
<body>
  <div class="w">
    <div class="card">
      <p class="logo">Tender<span class="dot">Base</span></p>
      <h1>You're offline</h1>
      <p>TenderBase needs an internet connection to load current tender opportunities.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </div>
</body>
</html>
